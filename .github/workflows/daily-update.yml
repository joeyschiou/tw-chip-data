name: daily-update

# 每天台北 22:00 = UTC 14:00 自動跑
# FinMind 免費帳號:600 call/hr,fetch_daily 用到上限-60 自動停(watchlist 優先,universe 輪轉);
# 剩下的 universe 由 daily-extend.yml 每小時接力。
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:        # 允許在 GitHub 網頁手動觸發(測試用)

# 讓 workflow 有權限 commit 回 repo(預設唯讀,不開會推不回去)
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}     # 分支最新(排程常延遲,期間 daily-extend 可能已推新 commit)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests pandas pyyaml pyarrow

      - name: Run update
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/update.py

      # 資料步驟之後跑篩選機:產出報告/模型組合狀態/農場擴充。
      # 農場會改 config/watchlist.yaml → 下方 commit 一併帶走。
      - name: Screener (訊號報告 + 模型組合 + 農場)
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python scripts/screener.py

      - name: Commit new data
        # 有變動才 commit;daily-extend 若先推了就 rebase 重推
        run: |
          bash scripts/commit_push.sh "auto: daily data update $(date -u +%Y-%m-%d)" data/ config/watchlist.yaml
